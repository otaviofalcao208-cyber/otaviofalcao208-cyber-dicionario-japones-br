name: Kotoba v200 - teste real de navegador
on:
  push:
    branches:
      - teste/kotoba-v200-desempenho
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar desktop e celular
        run: python tests/browser_smoke.py
      - name: Guardar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-v200-navegador
          path: test-results/
          if-no-files-found: warn
