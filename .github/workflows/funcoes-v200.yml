name: Kotoba v200 - funcoes apos separacao
on:
  push:
    branches:
      - teste/kotoba-v200-desempenho
  workflow_dispatch:
permissions:
  contents: read
jobs:
  funcoes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verificar busca, favoritos, audio, paginacao e offline
        run: python tests/lazy_browser_v200.py
      - name: Salvar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-v200-funcoes
          path: test-results/
