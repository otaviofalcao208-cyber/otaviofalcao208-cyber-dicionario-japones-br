name: Kotoba v200 - comparacao de desempenho e funcoes
on:
  push:
    branches:
      - teste/kotoba-v200-desempenho
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: main
          path: v199-checkout
          fetch-depth: 1
      - name: Preparar versao v199 isolada
        run: |
          mv v199-checkout /tmp/kotoba-v199
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Comparar v199 e v200 em desktop e mobile
        run: python tests/compare_versions.py
      - name: Salvar comparacao e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-v199-v200-comparacao
          path: test-results/
